openapi: 3.1.0
info:
  title: TrainerGigs AI training jobs data
  version: "1.3.1"
  summary: Free, read-only files on remote AI training jobs.
  description: |
    Free files from trainergigs.com. No key and no sign-up. Every address is a plain GET.

    A CDN caches each file for 5 minutes. The files send Access-Control-Allow-Origin: *, so a page on any site
    can fetch them. They are served gzipped to a client that asks, and a request with If-Modified-Since gets a
    304 when the file has not changed.

    Name your program in the User-Agent header. On Nov 12, 2026 the CDN refused the default one of Python's
    urllib (Python-urllib) with a 403. Every other client that was tried got the file.

    New fields may be added to a file at any time. A field is never taken away without a new major version, so
    read the fields you know and pass over the rest.

    Credit line: "Data: TrainerGigs, https://trainergigs.com". Pay is as each listing states it.
  contact:
    name: TrainerGigs
    email: hello@trainergigs.com
    url: https://trainergigs.com
  license:
    name: CC BY 4.0 (data), MIT (code)
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://trainergigs.com
security: []
externalDocs:
  description: How the numbers are counted
  url: https://trainergigs.com/data-method
tags:
  - name: roles
    description: Every open role, one by one
  - name: counts
    description: Open roles by platform and field, by day and by closed week
  - name: feeds
    description: RSS feeds, the sitemap and the plain list of pages
paths:
  /ai-training-jobs-data.json:
    get:
      operationId: getDaily
      tags: [counts]
      summary: Open roles by platform and field, with the day's totals
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: The daily file, rebuilt with the site build.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Daily"
  /ai-training-jobs-data.csv:
    get:
      operationId: getDailyCsv
      tags: [counts]
      summary: The daily rows as CSV
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: One row per platform and field. The columns are the fields of a daily row.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/csv:
              schema:
                type: string
  /ai-training-jobs-weekly.json:
    get:
      operationId: getWeekly
      tags: [counts]
      summary: Every closed week
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: The weekly file.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weekly"
  /ai-training-jobs-weekly.csv:
    get:
      operationId: getWeeklyCsv
      tags: [counts]
      summary: Every closed week by platform and field, as CSV
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: One row per week, platform and field.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/csv:
              schema:
                type: string
  /ai-training-jobs-roles.json:
    get:
      operationId: getRoles
      tags: [roles]
      summary: Every open role, one line each
      description: Rebuilt with the site build. Each role links to its own page on trainergigs.com.
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: The roles file.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roles"
  /feed.xml:
    get:
      operationId: getFeed
      tags: [feeds]
      summary: RSS feed of the newest roles on the board
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: RSS 2.0.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/xml:
              schema:
                type: string
  /feed-weekly.xml:
    get:
      operationId: getFeedWeekly
      tags: [feeds]
      summary: RSS feed with one item per closed week
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: RSS 2.0.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/xml:
              schema:
                type: string
  /feed-changes.xml:
    get:
      operationId: getFeedChanges
      tags: [feeds]
      summary: RSS feed of platforms whose open roles grew, week by week
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: RSS 2.0.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/xml:
              schema:
                type: string
  /sitemap.xml:
    get:
      operationId: getSitemap
      tags: [feeds]
      summary: Sitemap of every page
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: Sitemap protocol XML.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/xml:
              schema:
                type: string
  /llms.txt:
    get:
      operationId: getLlmsTxt
      tags: [feeds]
      summary: A plain list of every page, with its number of the day
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          $ref: "#/components/responses/Refused"
        "200":
          description: Plain text.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AllowOrigin"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
components:
  headers:
    AllowOrigin:
      description: Always "*". A page on any site can read the file.
      schema:
        type: string
        const: "*"
    CacheControl:
      description: The file may be kept for 5 minutes.
      schema:
        type: string
        example: public, max-age=300, stale-if-error=86400
  responses:
    NotModified:
      description: The file has not changed since the day and time sent in If-Modified-Since.
    Refused:
      description: The CDN refused the request. On Nov 12, 2026 it did so for the default User-Agent of Python's urllib. Name your program in the User-Agent header.
  schemas:
    Daily:
      type: object
      required: [name, date, source, method, totals, fields, rows]
      properties:
        name:
          type: string
        date:
          type: string
          format: date
          description: The day the numbers were counted.
        source:
          type: string
          format: uri
        method:
          type: array
          description: How the numbers are counted, one sentence per item.
          items:
            type: string
        totals:
          $ref: "#/components/schemas/DailyTotals"
        fields:
          type: array
          description: The names of the fields of a row, in CSV column order.
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DailyRow"
    DailyTotals:
      type: object
      required: [open_roles, platforms_with_open_roles, paid_research_studies, roles_that_state_pay]
      properties:
        open_roles:
          type: integer
        platforms_with_open_roles:
          type: integer
        paid_research_studies:
          type: integer
        roles_that_state_pay:
          type: integer
        roles_with_hourly_pay:
          type: integer
        median_listed_hourly_usd:
          type: number
        q1_listed_hourly_usd:
          type: number
        q3_listed_hourly_usd:
          type: number
    DailyRow:
      type: object
      required: [platform, field, open_roles, roles_with_hourly_pay, median_listed_hourly_usd, posted_last_7_days, countries_named, feed_read, kind]
      properties:
        platform:
          type: string
        field:
          type: string
        open_roles:
          type: integer
        roles_with_hourly_pay:
          type: integer
        median_listed_hourly_usd:
          type: [number, "null"]
          description: Null when fewer than 8 roles state hourly pay.
        posted_last_7_days:
          type: integer
        countries_named:
          type: integer
        feed_read:
          type: string
          description: The day the platform's listings were read.
        kind:
          type: string
          enum: [role, study]
    Weekly:
      type: object
      required: [name, source, method, notes, revisions, weeks]
      properties:
        name:
          type: string
        source:
          type: string
          format: uri
        method:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
        revisions:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              first_day:
                type: string
                format: date
              last_day:
                type: string
                format: date
              why:
                type: string
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/Week"
    Week:
      type: object
      description: One closed week. A field may be null when the week has no value for it.
      required: [week, week_start, week_end, last_day, url]
      properties:
        week:
          type: string
          description: ISO week such as 2026-W45.
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        last_day:
          type: string
          format: date
          description: The week's day of record.
        days_counted:
          type: integer
        days_missing:
          type: array
          items:
            type: string
            format: date
        closed_on:
          type: string
          format: date
        revised:
          type: [string, "null"]
        open_sunday:
          type: integer
        open_prev_sunday:
          type: integer
        studies_sunday:
          type: integer
        listed_any_day:
          type: integer
        new_roles:
          type: integer
        renewed_new:
          type: integer
        gone_roles:
          type: integer
        renewed_gone:
          type: integer
        newly_tracked:
          type: integer
        old_postings:
          type: [integer, "null"]
        roles_100_plus:
          type: integer
        roles_100_plus_prev:
          type: integer
        roles_with_hourly_pay:
          type: integer
        median_listed_hourly_usd:
          type: [number, "null"]
        q1_listed_hourly_usd:
          type: [number, "null"]
        q3_listed_hourly_usd:
          type: [number, "null"]
        platforms_read:
          type: integer
        feeds_not_read:
          type: array
          items:
            type: string
        languages_named:
          type: integer
        countries_named:
          type: [integer, "null"]
        days_listed_median:
          type: [number, "null"]
        days_listed_n:
          type: [integer, "null"]
        roles_sunday:
          type: integer
        roles_prev_sunday:
          type: integer
        roles_new:
          type: integer
        roles_gone:
          type: integer
        platforms_with_roles:
          type: integer
        url:
          type: string
          format: uri
    Roles:
      type: object
      required: [source, counted, license, fields, totals, roles]
      properties:
        source:
          type: string
          format: uri
        counted:
          type: string
          format: date
          description: The day the roles were counted.
        license:
          type: string
        fields:
          type: object
          description: What each role field holds, in plain words.
          additionalProperties:
            type: string
        totals:
          $ref: "#/components/schemas/DailyTotals"
        roles:
          type: array
          description: Sorted by platform, then title, then url.
          items:
            $ref: "#/components/schemas/Role"
    Role:
      type: object
      description: One open listing. New fields may be added, so pass over a field you do not know.
      required: [id, url, title, platform, field, kind, pay_min, pay_max, pay_unit, paid_per_task, where, countries, posted]
      example:
        id: job-lionbridge-27259005-4bd4-4767-b4e3-bff478b57cab
        url: https://trainergigs.com/job-lionbridge-27259005-4bd4-4767-b4e3-bff478b57cab?src=api
        title: US English Transcriber
        platform: Lionbridge
        field: Language & Audio
        kind: role
        pay_min: 25
        pay_max: 34
        pay_unit: hr
        paid_per_task: false
        where: US
        countries: [US]
        posted: "2026-04-13"
      properties:
        id:
          type: string
          description: The role's key on the site, the last part of its address. It stays the same for as long as the role is open.
        url:
          type: string
          format: uri
          description: The role's own page on trainergigs.com, with the tag src=api. Link to it as it is.
        title:
          type: string
          description: The listing's title.
        platform:
          type: string
          description: The platform that lists the role.
        field:
          type: string
          description: The board's name for the role's field of work.
        kind:
          type: string
          enum: [role, study]
          description: role, or study for a paid research study. Studies are counted apart and are never called roles.
        pay_min:
          type: [number, "null"]
          description: The lower end of the listed pay. Null when the listing states no pay, and when it states a top only ("Up to $90/hr").
        pay_max:
          type: [number, "null"]
          description: The upper end of the listed pay. Null when the listing states no pay, and when it states a bottom only. One rate is both ends.
        pay_unit:
          type: [string, "null"]
          enum: [hr, task, yr, null]
          description: The unit of the listed pay, per hour, per task or per year. Null when the listing states no pay.
        paid_per_task:
          type: boolean
          description: True when the listing gives an hourly figure but says it pays per task.
        where:
          type: string
          description: The board's short place text, such as "US" or "58 countries". Empty when no country is named.
        countries:
          type: array
          items:
            type: string
            pattern: "^[A-Z]{2}$"
          description: The two-letter codes of the countries the listing names for applicants, in its order. Empty when it names none.
        posted:
          type: [string, "null"]
          format: date
          description: The day the platform itself dated the listing. Null when it gives none.
