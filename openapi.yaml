openapi: 3.1.0
info:
  title: TrainerGigs AI training jobs data
  version: "1.0.0"
  summary: Free, read-only files on remote AI training jobs.
  description: |
    Free files from trainergigs.com. No key. A CDN caches each file for 5 minutes.
    The files send Access-Control-Allow-Origin: *, so a page on any site can fetch them.
    Credit line: "Data: TrainerGigs, https://trainergigs.com". Pay is as each listing states it.
  contact:
    name: TrainerGigs
    email: hello@trainergigs.com
    url: https://trainergigs.com
  license:
    name: CC BY 4.0 (data), MIT (code)
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://trainergigs.com
paths:
  /ai-training-jobs-data.json:
    get:
      operationId: getDaily
      summary: Open roles by platform and field, with the day's totals
      responses:
        "200":
          description: The daily file, rebuilt daily.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Daily"
  /ai-training-jobs-data.csv:
    get:
      operationId: getDailyCsv
      summary: The daily rows as CSV
      responses:
        "200":
          description: One row per platform and field. The columns are the fields of a daily row.
          content:
            text/csv:
              schema:
                type: string
  /ai-training-jobs-weekly.json:
    get:
      operationId: getWeekly
      summary: Every closed week
      responses:
        "200":
          description: The weekly file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weekly"
  /ai-training-jobs-weekly.csv:
    get:
      operationId: getWeeklyCsv
      summary: Every closed week by platform and field, as CSV
      responses:
        "200":
          description: One row per week, platform and field.
          content:
            text/csv:
              schema:
                type: string
  /ai-training-jobs-roles.json:
    get:
      operationId: getRoles
      summary: Every open role, one line each
      description: Rebuilt daily. Each role links to its own page on trainergigs.com.
      responses:
        "200":
          description: The roles file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roles"
  /feed.xml:
    get:
      operationId: getFeed
      summary: RSS feed of roles on the board
      responses:
        "200":
          description: RSS 2.0.
          content:
            application/xml:
              schema:
                type: string
  /feed-weekly.xml:
    get:
      operationId: getFeedWeekly
      summary: RSS feed with one item per closed week
      responses:
        "200":
          description: RSS 2.0.
          content:
            application/xml:
              schema:
                type: string
  /feed-changes.xml:
    get:
      operationId: getFeedChanges
      summary: RSS feed of platforms whose open roles grew, week by week
      responses:
        "200":
          description: RSS 2.0.
          content:
            application/xml:
              schema:
                type: string
  /sitemap.xml:
    get:
      operationId: getSitemap
      summary: Sitemap of every page
      responses:
        "200":
          description: Sitemap protocol XML.
          content:
            application/xml:
              schema:
                type: string
  /llms.txt:
    get:
      operationId: getLlmsTxt
      summary: A plain list of every page, with its number of the day
      responses:
        "200":
          description: Plain text.
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Daily:
      type: object
      required: [name, date, source, method, totals, fields, rows]
      properties:
        name:
          type: string
        date:
          type: string
          format: date
          description: The day the numbers were counted.
        source:
          type: string
          format: uri
        method:
          type: array
          description: How the numbers are counted, one sentence per item.
          items:
            type: string
        totals:
          $ref: "#/components/schemas/DailyTotals"
        fields:
          type: array
          description: The names of the fields of a row, in CSV column order.
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DailyRow"
    DailyTotals:
      type: object
      required: [open_roles, platforms_with_open_roles, paid_research_studies, roles_that_state_pay]
      properties:
        open_roles:
          type: integer
        platforms_with_open_roles:
          type: integer
        paid_research_studies:
          type: integer
        roles_that_state_pay:
          type: integer
        roles_with_hourly_pay:
          type: integer
        median_listed_hourly_usd:
          type: number
        q1_listed_hourly_usd:
          type: number
        q3_listed_hourly_usd:
          type: number
    DailyRow:
      type: object
      required: [platform, field, open_roles, roles_with_hourly_pay, median_listed_hourly_usd, posted_last_7_days, countries_named, feed_read, kind]
      properties:
        platform:
          type: string
        field:
          type: string
        open_roles:
          type: integer
        roles_with_hourly_pay:
          type: integer
        median_listed_hourly_usd:
          type: [number, "null"]
          description: Null when fewer than 8 roles state hourly pay.
        posted_last_7_days:
          type: integer
        countries_named:
          type: integer
        feed_read:
          type: string
          description: The day the platform's listings were read.
        kind:
          type: string
          enum: [role, study]
    Weekly:
      type: object
      required: [name, source, method, notes, revisions, weeks]
      properties:
        name:
          type: string
        source:
          type: string
          format: uri
        method:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
        revisions:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              first_day:
                type: string
                format: date
              last_day:
                type: string
                format: date
              why:
                type: string
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/Week"
    Week:
      type: object
      description: One closed week. A field may be null when the week has no value for it.
      required: [week, week_start, week_end, last_day, url]
      properties:
        week:
          type: string
          description: ISO week such as 2026-W45.
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        last_day:
          type: string
          format: date
          description: The week's day of record.
        days_counted:
          type: integer
        days_missing:
          type: array
          items:
            type: string
            format: date
        closed_on:
          type: string
          format: date
        revised:
          type: [string, "null"]
        open_sunday:
          type: integer
        open_prev_sunday:
          type: integer
        studies_sunday:
          type: integer
        listed_any_day:
          type: integer
        new_roles:
          type: integer
        renewed_new:
          type: integer
        gone_roles:
          type: integer
        renewed_gone:
          type: integer
        newly_tracked:
          type: integer
        old_postings:
          type: [integer, "null"]
        roles_100_plus:
          type: integer
        roles_100_plus_prev:
          type: integer
        roles_with_hourly_pay:
          type: integer
        median_listed_hourly_usd:
          type: [number, "null"]
        q1_listed_hourly_usd:
          type: [number, "null"]
        q3_listed_hourly_usd:
          type: [number, "null"]
        platforms_read:
          type: integer
        feeds_not_read:
          type: array
          items:
            type: string
        languages_named:
          type: integer
        countries_named:
          type: [integer, "null"]
        days_listed_median:
          type: [number, "null"]
        days_listed_n:
          type: [integer, "null"]
        roles_sunday:
          type: integer
        roles_prev_sunday:
          type: integer
        roles_new:
          type: integer
        roles_gone:
          type: integer
        platforms_with_roles:
          type: integer
        url:
          type: string
          format: uri
    Roles:
      type: object
      required: [source, counted, license, fields, totals, roles]
      properties:
        source:
          type: string
          format: uri
        counted:
          type: string
          format: date
          description: The day the roles were counted.
        license:
          type: string
        fields:
          type: object
          description: What each role field holds, in one sentence each.
          additionalProperties:
            type: string
        totals:
          $ref: "#/components/schemas/DailyTotals"
        roles:
          type: array
          description: Sorted by platform, then title, then url.
          items:
            $ref: "#/components/schemas/Role"
    Role:
      type: object
      required: [url, title, platform, field, kind, pay_min, pay_max, pay_unit, paid_per_task, where, posted]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: The role's own page on trainergigs.com.
        title:
          type: string
        platform:
          type: string
        field:
          type: string
          description: The board's name for the role's field of work.
        kind:
          type: string
          enum: [role, study]
        pay_min:
          type: [number, "null"]
        pay_max:
          type: [number, "null"]
        pay_unit:
          type: [string, "null"]
          enum: [hr, task, yr, null]
        paid_per_task:
          type: boolean
          description: True when the listing gives an hourly figure but says it pays per task.
        where:
          type: string
        posted:
          type: [string, "null"]
          format: date
