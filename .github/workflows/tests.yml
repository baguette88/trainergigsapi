name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python the client supports, on the newest runner image that still has it
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.15"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: The Python client, on the samples
        run: python3 -m unittest discover -s clients/python -p "test_*.py"
      - name: The documents against the samples
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: It installs, and the command runs
        run: |
          python3 -m pip install --quiet .
          trainergigs --version

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: The JavaScript client, on the samples
        run: node --test clients/js/trainergigs.test.mjs
