name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Python client, on the samples
        run: python3 -m unittest discover -s clients/python -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The JavaScript client, on the samples
        run: node --test clients/js/trainergigs.test.mjs
