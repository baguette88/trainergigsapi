name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python the client supports, on the newest runner image that still has it
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.15"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: The Python client, on the samples
        run: python3 -m unittest discover -s clients/python -p "test_*.py"
      - name: The documents against the samples
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: It installs, and the command runs
        run: |
          python3 -m pip install --quiet .
          trainergigs --version

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: The JavaScript client, on the samples
        run: node --test clients/js/trainergigs.test.mjs

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The action, on the live file
        id: table
        uses: ./
        with:
          country: "KE"
          field: "Language & Audio"
          markdown: "${{ runner.temp }}/roles.md"
          csv: "${{ runner.temp }}/roles.csv"
      - name: It wrote a table and said how many roles
        env:
          FOUND: ${{ steps.table.outputs.found }}
        run: |
          set -eu
          test "$FOUND" -ge 0
          head -n 1 "$RUNNER_TEMP/roles.csv" | grep -q "^pay,title,platform,"
          grep -q "Data: \[TrainerGigs\](https://trainergigs.com/?src=api)" "$RUNNER_TEMP/roles.md"
          head -n 5 "$RUNNER_TEMP/roles.md"
