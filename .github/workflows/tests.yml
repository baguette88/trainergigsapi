name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: The Python client, on the samples
        run: python3 -m unittest discover -s clients/python -p "test_*.py"
      - name: The documents against the samples
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: It installs, and the command runs
        run: |
          python3 -m pip install --quiet .
          trainergigs --version

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: The JavaScript client, on the samples
        run: node --test clients/js/trainergigs.test.mjs
